{% extends "base.html" %}
{% block titulo %}Publicaciones – Creaciones GMD{% endblock %}
{% block contenido %}
<div class="pag">
<div class="vh"><h2>Publicaciones</h2><button class="btn o" onclick="formPub()">＋ Nueva publicación</button></div><div class="gridc" id="g"></div>
</div>
{% endblock %}
{% block js %}<script>
function recargar(){api('GET','/api/publicaciones').then(function(L){$('g').innerHTML=L.map(function(b){var u='/uploads/'+esc(b.imagen);return '<div class="panel"><img class="pimg" src="'+u+'" alt="" loading="lazy" onclick="verImagen(\''+u+'\')"><p style="margin:10px 0 6px">'+esc(b.descripcion)+'</p><small style="color:var(--mut)">'+fd(b.fecha)+'</small> <span class="st '+(b.estado=='Publicada'?'ok':'p')+'">'+b.estado+'</span><div class="row2"><button class="btn k" onclick="formPub('+b.id+')">Editar</button><button class="btn d" onclick="twoStep(this,function(){api(\'DELETE\',\'/api/publicaciones/'+b.id+'\').then(recargar,falla)})">Eliminar</button></div></div>'}).join('')||'<p style="color:var(--mut)">Aún no hay publicaciones. Pulsa “Nueva publicación” y sube una imagen.</p>'},falla)}
recargar();
</script>{% endblock %}
